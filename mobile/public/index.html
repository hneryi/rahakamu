<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Rahakamu</title>
    <!-- App identity: installable (standalone) web app + home-screen icon. Values mirror app.json "web". -->
    <meta name="description" content="Personal Economic Trainer: talk with your own money. Not an official S-Pankki product." />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="Rahakamu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rahakamu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* Dynamic viewport height: follows mobile browser chrome and an embedding web view. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Brand background while the bundle loads, so the dark app never flashes white. */
        background-color: #07140f;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
