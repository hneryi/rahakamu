[project]
name = "spankkibot-backend"
version = "0.1.0"
description = "SPankkiBot - Personal Economic Trainer API (FastAPI + DuckDB + LLM agent)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "duckdb>=1.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openai>=1.50",
  "sse-starlette>=2.1",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
